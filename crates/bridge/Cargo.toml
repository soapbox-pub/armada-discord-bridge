[package]
name = "bridge"
version = "0.1.0"
description = "Discord <-> Armada (Concord) bridge: router, Discord adapter, Concord client"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm.workspace = true
anyhow = "1"
async-trait = "0.1"
base64.workspace = true
concord = { path = "../concord" }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex.workspace = true
hkdf.workspace = true
nostr.workspace = true
rand.workspace = true
regex = "1"
relay-pool = { path = "../relay-pool" }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "zlib"] }
twilight-http = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
