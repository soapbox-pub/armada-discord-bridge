[package]
name = "portal"
version = "0.1.0"
description = "Bridge portal: web setup and control plane for Discord <-> Armada bridges"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm.workspace = true
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64.workspace = true
bridge = { path = "../bridge" }
concord = { path = "../concord" }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex.workspace = true
nostr.workspace = true
rand.workspace = true
regex = "1"
relay-pool = { path = "../relay-pool" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
