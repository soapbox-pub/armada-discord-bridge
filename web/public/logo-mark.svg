<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Armada">
  <title>Armada</title>
  <!--
    Single-color Armada mark. Inherits the theme via `currentColor`, so it can
    be dropped anywhere (rail crest, favicon, loaders) and take the rose blade,
    gilt, or any token. Same cut-corner vessel silhouette + advancing-A blade.
  -->
  <!-- Cut-corner vessel crest: top-left & bottom-right chamfered -->
  <path d="M64 16 H232 a8 8 0 0 1 8 8 V192 L192 240 H24 a8 8 0 0 1 -8 -8 V64 Z"
        fill="none" stroke="currentColor" stroke-width="10"/>
  <!-- The A as an advancing blade -->
  <path d="M128 56 L180 162 H158 L128 100 L98 162 H76 Z"
        fill="currentColor"/>
  <!-- Waterline crossbar (negative cut) -->
  <path d="M106 134 H150 L158 150 H98 Z" fill="var(--logo-bg, #0e0a12)"/>
  <!-- Cyan-able wake (inherits currentColor at lower opacity) -->
  <g stroke="currentColor" stroke-linecap="round" opacity="0.55">
    <path d="M88 184 H168" stroke-width="6"/>
    <path d="M104 200 H152" stroke-width="4" opacity="0.7"/>
  </g>
</svg>
